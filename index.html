<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Birthday Letter</title>

  <!-- FONTS -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;

      -webkit-tap-highlight-color:transparent;
      -webkit-touch-callout:none;

      -webkit-user-select:none;
      user-select:none;
    }

    *::-webkit-scrollbar{
      display:none;
    }

    html{
      scrollbar-width:none;
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      overflow-y:auto;

      display:flex;
      align-items:center;
      justify-content:center;

      font-family:'Cormorant Garamond', serif;

      background:
      radial-gradient(circle at top,
      #2b0000 0%,
      #080000 75%);
    }

    .container{
      text-align:center;
    }

    h1{
      color:white;

      font-size:62px;
      font-weight:500;

      margin-bottom:20px;

      letter-spacing:1px;
    }

    .sub{
      color:#b8925f;

      letter-spacing:4px;
      font-size:15px;

      margin-bottom:45px;

      transition:0.4s ease;

      font-family:'Inter', sans-serif;
    }

    @keyframes floating {

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-10px);
      }

      100%{
        transform:translateY(0px);
      }
    }

    .envelope-wrapper{
      width:430px;
      height:270px;

      position:relative;
      margin:auto;

      cursor:pointer;

      perspective:1200px;

      animation:floating 3s ease-in-out infinite;

      touch-action:manipulation;
    }

    .envelope{
      width:100%;
      height:100%;

      position:relative;
      overflow:hidden;

      border-radius:14px;

      background:#ece4d7;

      box-shadow:
      0 20px 45px rgba(0,0,0,0.55);

      transition:
      box-shadow 0.15s linear,
      transform 0.15s linear;
    }

    .envelope.holding{

      box-shadow:

      0 0 20px rgba(255,190,70,0.20),
      0 0 40px rgba(255,190,70,0.25),
      0 0 70px rgba(255,190,70,0.30),

      0 20px 45px rgba(0,0,0,0.55);
    }

    .envelope::before{
      content:"";

      position:absolute;
      inset:0;

      background:#efe8dc;

      clip-path:polygon(
        0 100%,
        0 35%,
        50% 70%,
        100% 35%,
        100% 100%
      );

      z-index:1;
    }

    .flap{
      position:absolute;

      width:100%;
      height:100%;

      top:0;
      left:0;

      transform-origin:top;

      transition:1.2s ease;

      z-index:5;
    }

    .flap::before{
      content:"";

      position:absolute;
      top:0;
      left:0;

      width:100%;
      height:52%;

      background:#e2dbcf;

      clip-path:polygon(
        0 0,
        100% 0,
        50% 100%
      );

      box-shadow:
      inset 0 -8px 12px rgba(0,0,0,0.08);
    }

    .letter{
      position:absolute;

      width:88%;
      height:84%;

      left:6%;
      bottom:-100%;

      background:white;

      border-radius:8px;

      z-index:2;
    }

    .seal{
      position:absolute;

      width:95px;
      height:95px;

      border-radius:50%;

      background:
      radial-gradient(circle at top,
      #ff3a3a,
      #850000);

      display:flex;
      align-items:center;
      justify-content:center;

      left:50%;
      top:50%;

      transform:translate(-50%, -50%);

      z-index:10;

      box-shadow:
      inset 0 4px 12px rgba(255,255,255,0.25),
      0 6px 20px rgba(0,0,0,0.55);

      transition:0.6s ease;
    }

    .seal span{
      font-size:42px;
      color:#500000;
    }

    .open .flap{
      transform:rotateX(180deg);
    }

    .open .seal{
      opacity:0;

      transform:
      translate(-50%, -50%)
      scale(0);
    }

    @keyframes openEnvelope {

      0%{
        transform:scale(1) rotateX(0deg);
        opacity:1;
      }

      40%{
        transform:scale(1.08) rotateX(-10deg);
      }

      100%{
        transform:scale(1.4) rotateX(-25deg);
        opacity:0;
      }
    }

    .animate-open{
      animation:openEnvelope 1s ease forwards;
    }

    .progress-ring{
      width:95px;
      height:95px;

      margin:50px auto 0;

      position:relative;
    }

    svg{
      transform:rotate(-90deg);
    }

    .progress-bg{
      fill:none;

      stroke:#2b1b1b;
      stroke-width:8;
    }

    .progress{
      fill:none;

      stroke:#d9a441;
      stroke-width:8;

      stroke-linecap:round;

      stroke-dasharray:251;
      stroke-dashoffset:251;

      transition:stroke-dashoffset 0.1s linear;
    }

    .percentage{
      position:absolute;

      top:50%;
      left:50%;

      transform:translate(-50%, -50%);

      color:#d6a35f;
      font-size:18px;

      font-family:'Inter', sans-serif;
    }

    .message-screen{
      width:100%;
      min-height:100vh;
      margin:30px auto;
      overflow:auto;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      background:
      radial-gradient(circle at top,
      #2b0000 0%,
      #080000 75%);
    }

    .card{
      width:700px;
      max-width:92%;

      padding:34px 42px 28px;

      border-radius:30px;

      background:
      linear-gradient(
      145deg,
      rgba(20,0,0,0.95),
      rgba(10,0,0,0.92));

      border:1px solid rgba(255,120,120,0.12);

      color:white;

      position:relative;

      box-shadow:
      0 20px 60px rgba(0,0,0,0.6);

      animation:fadeUp 1s ease;
    }

    .card h2{
      text-align:center;

      font-size:38px;

      margin-bottom:20px;

      font-weight:500;

      line-height:1.1;

      letter-spacing:-0.5px;
    }

    .quote-top{
      position:absolute;

      top:18px;
      left:22px;

      font-size:42px;
      line-height:1;

      color:#a97a4c;

      opacity:0.45;
    }

    .quote-bottom{
      position:absolute;

      bottom:6px;
      right:18px;

      font-size:42px;
      line-height:1;

      color:#a97a4c;

      opacity:0.45;
    }

    .message-content{
      position:relative;

      padding:6px 0 8px;

      line-height:1.3;
    }

    .to{
      font-size:24px;

      font-weight:500;

      margin-bottom:30px;

      position:relative;
      z-index:2;
    }

    .to p{
      margin-bottom:22px;
    }

    .to p:last-child{
      margin-bottom:0;
    }

    .from{
      text-align:right;

      color:#a97a4c;

      font-style:italic;

      font-size:20px;

      margin-bottom:0;

      position:relative;
      z-index:2;
    }

    .made-by{
      margin-top:18px;
      color:#a97a4c;
      font-size:14px;
      font-family:'Inter', sans-serif;
      opacity:0.5;
    }

    .feel-section{
      margin-top:34px;
      margin-bottom:10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .reaction-title{
      color:#8d6a47;
      font-size:16px;
      text-align:center;
      letter-spacing:1.5px;
    }

    .reactions{
      display:flex;
      justify-content:center;

      gap:18px;

      margin-top:22px;
    }

    .reaction{
      width:62px;
      height:62px;

      border-radius:50%;
      border:none;

      background:rgba(255,255,255,0.08);

      font-size:28px;

      cursor:pointer;

      transition:0.3s ease;

      backdrop-filter:blur(10px);
    }

    .reaction:hover{
      transform:scale(1.08);

      background:
      rgba(255,255,255,0.15);
    }

    @keyframes fadeUp {

      from{
        opacity:0;
        transform:translateY(50px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:600px){

      h1{
        font-size:40px;
      }

      .envelope-wrapper{
        width:290px;
        height:190px;
      }

      .seal{
      width:80px;
      height:80px;
      }

      .card{
        padding:28px;
      }

      .card h2{
        font-size:25px;
      }

      .to{
        font-size:20px;
      }

      .from{
        font-size:16px;
      }

      .quote-top,
      .quote-bottom{
        font-size:34px;
      }

      .reaction{
        width:54px;
        height:54px;

        font-size:24px;
      }
    }

  </style>

</head>

<body>

  <script>

    const birthdayMessage = `

      <p>Happy Birthday!</p>

      <p>
      I just wanted to take a moment to remind you how truly special you are. Life becomes so much brighter with a friend like you in it. Your kindness, laughter, strength, and the way you care for the people around you make you one of the most amazing people I know.
      </p>

      <p>
      Thank you for all the memories, conversations, support, and happiness you’ve brought into my life. Whether we’re laughing over silly things or helping each other through difficult days, every moment with you means a lot to me.
      </p>

      <p>You deserve nothing but happiness, success, love, and peace today and always. I hope this year brings you closer to your dreams and fills your life with beautiful surprises. Never forget how valued and loved you are.
      </p>

      <p>Keep smiling, keep shining, and keep being the wonderful person you are. The world is lucky to have someone like you.</p>

      <p>Happy Birthday once again! May your day be as beautiful and unforgettable as you are.</p>


    `;

    const fromMessage =
      "— from Dhanush";

  </script>

  <div class="container">

    <h1>
      A Letter For You
    </h1>

    <div class="sub" id="subText">
      HOLD TO UNSEAL
    </div>

    <div class="envelope-wrapper" id="wrapper">

      <div class="envelope" id="envelope">

        <div class="flap"></div>

        <div class="letter"></div>

        <div class="seal">
          <span>♡</span>
        </div>

      </div>

    </div>

    <div class="progress-ring">

      <svg width="95" height="95">

        <circle
          class="progress-bg"
          cx="47.5"
          cy="47.5"
          r="40">
        </circle>

        <circle
          class="progress"
          cx="47.5"
          cy="47.5"
          r="40">
        </circle>

      </svg>

      <div class="percentage" id="percent">
        0%
      </div>

    </div>

  </div>

  <script>

    const wrapper =
      document.getElementById("wrapper");

    const envelope =
      document.getElementById("envelope");

    const progress =
      document.querySelector(".progress");

    const percent =
      document.getElementById("percent");

    const subText =
      document.getElementById("subText");

    const circumference = 251;

    let progressValue = 0;

    let holdTimer;

    function startHold(){

      progressValue = 0;

      subText.innerText =
        "ALMOST THERE...";

      envelope.classList.add("holding");

      holdTimer = setInterval(() => {

        progressValue++;

        const glow =
          progressValue * 0.6;

        envelope.style.boxShadow = `
          0 0 ${glow}px rgba(255,190,70,0.25),
          0 0 ${glow * 1.8}px rgba(255,190,70,0.30),
          0 0 ${glow * 3}px rgba(255,190,70,0.35),
          0 20px 45px rgba(0,0,0,0.55)
        `;

        percent.innerText =
          progressValue + "%";

        progress.style.strokeDashoffset =
          circumference -
          (circumference * progressValue) / 100;

        if(progressValue >= 100){

          clearInterval(holdTimer);

          wrapper.classList.add("open");

          setTimeout(() => {

            wrapper.classList.add("animate-open");

          }, 400);

          setTimeout(() => {

            document.body.innerHTML = `

            <div class="message-screen">

              <div class="card">

                <div class="quote-top">“</div>

                <h2>
                  Happy Birthday Sowmya
                </h2>

                <div class="message-content">

                  <div class="to">
                    ${birthdayMessage}
                  </div>

                  <div class="from">
                    ${fromMessage}
                  </div>

                </div>

                <div class="quote-bottom">”</div>

              </div>

              <div class="feel-section">

                <div class="reaction-title">
                  how did this make you feel?
                </div>

                <div class="reactions">

                  <button 
                    class="reaction"
                    data-reaction="❤️">
                    ❤️
                  </button>

                  <button
                    class="reaction"
                    data-reaction="😍">
                    😍
                  </button>

                  <button
                    class="reaction"
                    data-reaction="🥰">
                    🥰
                  </button>

                  <button
                    class="reaction"
                    data-reaction="🥺">
                    🥺
                  </button>

                </div>

              </div>

              <p class="made-by">
                Made with ❤️ by Dhanush
              </p>

            </div>

            `;

            setTimeout(() => {

              const reactions =
                document.querySelectorAll(".reaction");

              reactions.forEach((button) => {

                button.addEventListener("click", () => {

                  const reaction =
                    button.dataset.reaction;

                  const phone =
                    "919902256120";

                  const text =
                    encodeURIComponent(
                      `${reaction}`
                    );

                  const url =
                    `https://wa.me/${phone}?text=${text}`;

                  window.open(url, "_blank");

                });

              });

            }, 100);

          }, 1700);
        }

      }, 22);
    }

    function stopHold(){

      clearInterval(holdTimer);

      envelope.classList.remove("holding");

      envelope.style.boxShadow =
        "0 20px 45px rgba(0,0,0,0.55)";

      if(progressValue < 100){

        progressValue = 0;

        percent.innerText = "0%";

        subText.innerText =
          "HOLD TO UNSEAL";

        progress.style.strokeDashoffset =
          circumference;
      }
    }

    wrapper.addEventListener(
      "mousedown",
      startHold
    );

    wrapper.addEventListener(
      "mouseup",
      stopHold
    );

    wrapper.addEventListener(
      "mouseleave",
      stopHold
    );

    wrapper.addEventListener(
      "touchstart",
      (e) => {
        e.preventDefault();
        startHold();
      },
      { passive:false }
    );

    wrapper.addEventListener(
      "touchend",
      (e) => {
        e.preventDefault();
        stopHold();
      },
      { passive:false }
    );

  </script>

</body>
</html>
